min_version: 2.0.0

# Use the familiar glob behavior where `**` also matches files directly in a
# directory. See https://lefthook.dev/configuration/glob_matcher/.
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: staged-diff
      # Hooks must not inherit an interactive pager from the user's Git setup.
      run: git --no-pager diff --cached --check

    - name: frontend-eslint
      glob: 'src/**/*.{vue,ts,tsx,js,jsx}'
      run: pnpm exec eslint {staged_files}

    - name: frontend-oxfmt
      glob:
        - '**/*.{vue,ts,tsx,js,jsx,mjs,cjs,json,css,scss,html,md,yaml,yml}'
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}

    - name: backend-rustfmt
      glob: 'crates/**/*.rs'
      run: cargo fmt --all -- --check

pre-push:
  parallel: true
  jobs:
    - name: frontend-check
      glob:
        - 'src/**'
        - 'scripts/**'
        - 'package.json'
        - 'pnpm-lock.yaml'
        - 'tsconfig*.json'
        - 'vite.config.ts'
        - 'eslint.config.ts'
        - '.oxfmtrc.json'
      # The build generates declarations required by `vue-tsc` in a clean checkout.
      run: pnpm build && pnpm check

    - name: backend-clippy
      glob:
        - 'crates/**'
        - 'Cargo.toml'
        - 'Cargo.lock'
        - '.cargo/**'
        - 'rust-toolchain'
        - 'rust-toolchain.toml'
      run: cargo clippy --workspace --all-features --all-targets -- -D warnings
