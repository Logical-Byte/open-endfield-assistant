<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- /favicon.ico -> resources/icons/icon.ico -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- <link rel="preconnect" href="https://fonts.bunny.net" /> -->
    <!-- <link href="https://fonts.bunny.net/css?family=public-sans:400,500,600,700" rel="stylesheet" /> -->
    <title>OEA - 终末地小助手</title>
    <meta
      name="description"
      content="OEA 是开源免费的终末地小助手，支持档案查漏补缺和百趣演武自动抽。"
    />
    <meta property="og:title" content="OEA - 终末地小助手" />
    <meta
      property="og:description"
      content="OEA 是开源免费的终末地小助手，支持档案查漏补缺和百趣演武自动抽。"
    />
    <meta property="og:image" content="/favicon.ico" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: #18181b;
      }
    </style>
    <script>
      (function () {
        var mode = localStorage.getItem('vueuse-color-scheme') || 'auto';
        var dark =
          mode === 'dark' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18181b');
        }
      })();
    </script>
  </head>

  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
