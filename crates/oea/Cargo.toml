[package]
name = "oea"
# version = "0.1.0"
description = "OEA - 明日方舟终末地自动化助手"
authors = ["Logical-Byte"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
anyhow = { workspace = true }
az = "1.3.0"
base64 = "0.23.0"
chrono = { workspace = true }
fastrand = "2.5.0"
image = { workspace = true }
imageproc = { workspace = true }
indexmap = { version = "2.14.0", features = ["serde"] }
oea-logger = { version = "0.0.0", path = "../oea-logger" }
oea-update = { version = "0.0.0", path = "../oea-update" }
oea-vision = { version = "0.0.0", path = "../oea-vision" }
oea-window = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["blocking", "native-tls"] }
rodio = { version = "0.23", default-features = false, features = ["wav", "playback", "tracing"] }
scopeguard = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tracing = { workspace = true }
ts-rs = { workspace = true }


[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber.workspace = true

# strip = "symbols"
# lto = true
# panic = "abort"
# codegen-units = 1
