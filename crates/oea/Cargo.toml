[package]
name = "oea"
# version = "0.1.0"
description = "OEA - 明日方舟终末地自动化助手"
authors = ["Logical-Byte"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
az = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
fastrand = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
libc = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "native-tls", "query", "stream"] }
rodio = { workspace = true, features = ["wav", "playback", "tracing"] }
rten = { workspace = true, features = ["onnx_format"] }
scopeguard = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-opener = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true, features = ["chrono"] }
ts-rs = { workspace = true }
zip = { workspace = true }


[target."cfg(windows)".dependencies]
webview2-com = { workspace = true }
windows = { workspace = true, features = ["Foundation_Metadata", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Security_Authorization_AppCapabilityAccess", "Win32_Devices_Display", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
cli = []
# strip = "symbols"
# lto = true
# panic = "abort"
# codegen-units = 1
