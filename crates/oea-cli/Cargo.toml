[package]
name = "oea-cli"
description = "OEA 开发者工具"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
oea = { path = "../oea", features = ["cli"] }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
