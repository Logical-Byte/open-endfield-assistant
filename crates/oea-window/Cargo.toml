[package]
name = "oea-window"
description = "OEA 目标窗口查找、截图与物理输入"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = { workspace = true }
image = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Foundation_Metadata", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Security_Authorization_AppCapabilityAccess", "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
scopeguard = { workspace = true }
tracing = { workspace = true }
