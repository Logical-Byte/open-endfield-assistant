[package]
name = "oea-update"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow.workspace = true
bytes = "1.12.1"
futures-util = "0.3.34"
reqwest = { workspace = true, features = ["native-tls", "query", "stream"] }
semver = "1.0.28"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["sync", "macros", "time", "rt"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing.workspace = true
zip.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tracing-subscriber.workspace = true
