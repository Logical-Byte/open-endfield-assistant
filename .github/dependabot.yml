version: 2

updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Tauri/WebView2 仍使用 0.61；跨 minor/major 升级会新增一套 windows-rs 编译。
      - dependency-name: windows
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      routine-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      routine-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
