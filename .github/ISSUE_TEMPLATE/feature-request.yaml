name: 功能建议
description: 提议新功能或现有功能的改进
labels: ['enhancement']
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      description: 请确认以下事项。
      options:
        - label: 我确认这是一项功能建议，而不是 Bug 反馈。
          required: true
        - label: 我已搜索现有及已关闭的 Issue，确认没有重复建议。
          required: true

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 请说明你遇到的困难、限制或使用场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望新增或改进的功能，以及它应如何工作。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或补充内容
      description: 请填写考虑过的替代方案、相关截图或其他背景信息。
