name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # oea-resource 是私有仓库，GITHUB_TOKEN 无法访问，需用有权限的 PAT（secret: OEA_SUBMODULE_TOKEN）
          token: ${{ secrets.OEA_SUBMODULE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # 先运行构建，生成 `auto-imports.d.ts` 和 `components.d.ts`，否则类型检查会报错。
      - name: Frontend build
        run: pnpm run build

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: Frontend lint
        run: pnpm run lint

      - name: Frontend format check
        run: pnpm run format:check

  backend-ci:
    name: Backend CI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # oea-resource 是私有仓库，GITHUB_TOKEN 无法访问，需用有权限的 PAT（secret: OEA_SUBMODULE_TOKEN）
          token: ${{ secrets.OEA_SUBMODULE_TOKEN }}

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Backend check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Backend clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Backend format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Backend test
        working-directory: src-tauri
        run: cargo test
