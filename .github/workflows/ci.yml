name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect backend changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - '.gitmodules'
              - 'resources'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'src-tauri/**'

  frontend-ci:
    name: Frontend CI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # 先运行构建，生成 `auto-imports.d.ts` 和 `components.d.ts`，否则类型检查会报错。
      - name: Frontend build
        run: pnpm run build

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: Frontend lint
        run: pnpm run lint

      - name: Frontend format check
        run: pnpm run format:check

  backend-ci:
    name: Backend CI
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Backend format check
        id: fmt
        continue-on-error: true
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Backend test
        id: test
        continue-on-error: true
        working-directory: src-tauri
        run: cargo test

      - name: Backend clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Propagate backend failures
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if ("${{ steps.fmt.outcome }}" -eq "failure" -or "${{ steps.test.outcome }}" -eq "failure") {
            exit 1
          }
