[workspace]
members = [
  "crates/oea",
  "crates/oea-cli",
  "crates/oea-logger",
  "crates/oea-update",
  "crates/oea-update/tests/host",
  "crates/oea-vision",
  "crates/oea-window",
]
default-members = ["crates/oea"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
image = "0.25.10"
imageproc = "0.27.0"
oea-window = { path = "crates/oea-window" }
reqwest = { version = "0.13", default-features = false }
scopeguard = "1.2.0"
serde = "1.0"
serde_json = "1.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "11"
windows = "0.62"
zip = "7.2.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
opt-level = 1
debug = false
overflow-checks = false
