[workspace]
members = ["crates/oea", "crates/oea-cli"]
default-members = ["crates/oea"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
image = "0.25.10"
serde = "1.0"
serde_json = "1.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
opt-level = 1
debug = false
overflow-checks = false
