[workspace]
members = ["crates/oea", "crates/oea-cli"]
default-members = ["crates/oea"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
az = "1.3.0"
base64 = "0.23.0"
bytes = "1.12.1"
chrono = "0.4.45"
clap = "4.6.7"
fastrand = "2.5.0"
futures-util = "0.3.34"
image = "0.25.10"
imageproc = "0.27.0"
indexmap = "2.14.0"
libc = "0.2.189"
oea = { path = "crates/oea" }
reqwest = { version = "0.13", default-features = false }
rodio = { version = "0.23", default-features = false }
rten = { version = "0.24", default-features = false }
scopeguard = "1.2.0"
semver = "1.0.28"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11.0"
tauri = "~2.12"
tauri-build = "2.6.3"
tauri-plugin-opener = "2"
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
ts-rs = "11"
webview2-com = "0.39"
windows = "0.62"
zip = "7.2.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
opt-level = 1
debug = false
overflow-checks = false
